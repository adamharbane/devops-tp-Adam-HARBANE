services:
  db:
    image: postgres:16-alpine
    container_name: room-reservation-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservation_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservation_secret}
      POSTGRES_DB: ${POSTGRES_DB:-room_reservations}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-reservation_app} -d ${POSTGRES_DB:-room_reservations}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: room-reservation-api
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-reservation_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservation_secret}
      POSTGRES_DB: ${POSTGRES_DB:-room_reservations}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
